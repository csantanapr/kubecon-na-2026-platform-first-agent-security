# The developer's half: one object in Git.
# No runtime class, no worker pool, no network rules. The platform decides those.
apiVersion: acme.dev/v1alpha1
kind: AgentWorkload
metadata:
  name: support-agent
  namespace: team-a
spec:
  prompt: You triage GitHub issues for the acme project and suggest labels.
  allowedOrigins:
    - https://api.github.com
